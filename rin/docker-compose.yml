## Local Postgres for Spark RIN.
##   docker compose up -d
##   DB_DRIVER=postgres npm run start:dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: rin-postgres
    environment:
      POSTGRES_USER: rin
      POSTGRES_PASSWORD: rin
      POSTGRES_DB: rin
    ports:
      - "5432:5432"
    volumes:
      - rin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rin -d rin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rin-pgdata:
